# =============================================================================
# EL SCORE OS — Docker Compose (Local Development)
# Services: PostgreSQL, Redis
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: elscore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elscore
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: elscore_os_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elscore -d elscore_os_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elscore_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
